<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f1ecdf"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- petites étoiles -->
  <g fill="#a8813a">
    <circle cx="96" cy="108" r="3.2" opacity=".85"/>
    <circle cx="168" cy="70" r="2.2" opacity=".6"/>
    <circle cx="356" cy="84" r="2.8" opacity=".75"/>
    <circle cx="428" cy="140" r="2" opacity=".55"/>
    <circle cx="70" cy="250" r="2.2" opacity=".5"/>
    <circle cx="444" cy="280" r="2.6" opacity=".6"/>
    <circle cx="120" cy="408" r="2.4" opacity=".6"/>
    <circle cx="396" cy="404" r="3" opacity=".7"/>
    <circle cx="256" cy="56" r="3.4" opacity=".9"/>
  </g>

  <!-- le cœur, tracé d'or -->
  <path d="M256 416 C 130 320 80 250 96 178 C 108 124 160 96 208 112 C 234 121 250 140 256 156 C 262 140 278 121 304 112 C 352 96 404 124 416 178 C 432 250 382 320 256 416 Z"
        fill="none" stroke="#a8813a" stroke-width="15" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- l'étoile au cœur -->
  <path d="M256 218 L268 254 L306 254 L275 276 L287 312 L256 290 L225 312 L237 276 L206 254 L244 254 Z"
        fill="#cfa95e" filter="url(#glow)"/>
</svg>
